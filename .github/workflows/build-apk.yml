# Genera la APK automáticamente en GitHub (sin instalar Android SDK en tu compu).
# Sube el proyecto a un repo → pestaña Actions → descarga "test-vocacional-apk".
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci || npm install
      - name: Crear proyecto Android (si no existe)
        run: |
          if [ ! -d android ]; then npm run android:init; else npm run android:sync; fi
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: test-vocacional-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
